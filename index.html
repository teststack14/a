<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>LONDON Ledger</title>
<style>
  :root{--bg:#f4f6f8;--card:#fff;--ink:#1d2433;--muted:#6b7280;--line:#e5e7eb;--accent:#0f766e;--accent2:#0e7490;--red:#b91c1c;--redbg:#fef2f2;--amber:#92400e;--amberbg:#fffbeb;--green:#166534;--greenbg:#f0fdf4}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
  header{background:#0b3b4a;color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px;position:sticky;top:0;z-index:5}
  header h1{font-size:17px;margin:0;letter-spacing:.3px}
  header .who{font-size:13px;opacity:.9}
  button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:8px 14px;background:var(--accent);color:#fff}
  button.ghost{background:transparent;border:1px solid rgba(255,255,255,.5)}
  button.light{background:#eef2f5;color:var(--ink)}
  button:disabled{opacity:.6;cursor:default}
  main{max-width:1150px;margin:0 auto;padding:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
  .card h2{font-size:15px;margin:0 0 12px}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
  input,select,textarea{width:100%;font:inherit;padding:8px 10px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;color:var(--ink)}
  textarea{resize:vertical;min-height:38px}
  .grid{display:grid;gap:12px}
  .g3{grid-template-columns:repeat(3,1fr)}
  .g2{grid-template-columns:repeat(2,1fr)}
  .side{border:1px solid var(--line);border-radius:10px;padding:12px}
  .side.paid{border-top:4px solid #dc2626}
  .side.rec{border-top:4px solid #16a34a}
  .side h3{margin:0 0 10px;font-size:14px}
  .chk{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px;color:var(--ink);cursor:pointer}
  .chk input{width:18px;height:18px;margin:0;accent-color:var(--accent)}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:3px solid #0b3b4a;margin-bottom:12px}
  .tab{background:#e0f2f1;color:#0b3b4a;border-radius:8px 8px 0 0;padding:9px 16px;border:1px solid #b2dfdb;border-bottom:0;font-weight:700}
  .tab.active{background:#0b3b4a;color:#fff;border-color:#0b3b4a}
  .tab.active .cnt{background:#fff;color:#0b3b4a}
  .tab .cnt{font-size:11px;background:#e2e8f0;border-radius:99px;padding:1px 7px;margin-left:6px;color:var(--ink)}
  .b-pend-s{font-size:10.5px;padding:1px 6px;margin-left:6px}
  .hint{font-size:12.5px;margin-top:8px;padding:8px 10px;border-radius:8px;background:#f1f5f9;display:none}
  .hint.show{display:block}
  .hint .warn{color:var(--red);font-weight:600;display:block;margin-top:4px}
  .hint .pend{color:var(--amber);display:block;margin-top:4px}
  .balances{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
  .bal{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .bal .c{font-size:12px;color:var(--muted);font-weight:600}
  .bal .v{font-size:19px;font-weight:700;margin:2px 0}
  .bal .p{font-size:11.5px;color:var(--amber)}
  .neg{color:var(--red)}
  .grp{margin-bottom:18px}
  .grp h3{font-size:14px;margin:0 0 6px;display:flex;justify-content:space-between}
  .tbl{width:100%;border-collapse:collapse;font-size:13px}
  .tbl th,.tbl td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
  .tbl th{background:#f8fafc;font-size:12px;color:var(--muted);font-weight:600}
  .tbl td.n,.tbl th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .tbl tr.open td{color:var(--muted);font-style:italic}
  .tbl tr.close td{font-weight:700;background:#f8fafc}
  .badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;font-weight:600}
  .b-done{background:var(--greenbg);color:var(--green)}
  .b-pend{background:var(--amberbg);color:var(--amber)}
  .b-y{background:#eef2ff;color:#3730a3;margin-left:6px}
  .scroll{overflow-x:auto}
  .msg{padding:10px 12px;border-radius:8px;margin-top:10px;white-space:pre-line;display:none}
  .msg.err{display:block;background:var(--redbg);color:var(--red)}
  .msg.ok{display:block;background:var(--greenbg);color:var(--green)}
  #login{max-width:360px;margin:60px auto}
  .row-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .row-actions input{width:140px;padding:5px 8px}
  .row-actions button{padding:6px 10px}
  .muted{color:var(--muted)}
  .tbl tr.act td{border-top:0;padding-top:0}
  .tbl tr:has(+ tr.act) td{border-bottom:0}
  .hidden{display:none}
  #hdrRight{display:flex;gap:8px;align-items:center}
  #hdrRight.hidden{display:none}
  .topbar{display:flex;justify-content:flex-end;margin-bottom:16px}
  .btn-new{font-size:15px;font-weight:700;padding:12px 20px;border-radius:10px;box-shadow:0 2px 6px rgba(15,118,110,.25)}
  .overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:20;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:24px 12px}
  .overlay.hidden{display:none}
  .modal{background:#fff;border-radius:14px;width:100%;max-width:860px;padding:18px;box-shadow:0 10px 30px rgba(0,0,0,.2)}
  .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  .modal-head h2{margin:0;font-size:17px}
  .x{background:#eef2f5;color:var(--ink);width:36px;height:36px;padding:0;border-radius:50%;font-size:18px;line-height:36px}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
  .chip{background:#fff;color:var(--ink);border:1.5px solid #cbd5e1;border-radius:10px;padding:10px 14px;font-weight:700;min-width:64px;min-height:44px}
  .rec .chip.sel{background:#16a34a;border-color:#16a34a;color:#fff}
  .paid .chip.sel{background:#dc2626;border-color:#dc2626;color:#fff}
  .edit-btn{background:transparent;color:var(--accent2);border:0;padding:2px 6px;font-size:16px;line-height:1;margin-left:4px;border-radius:6px;vertical-align:middle}
  .edit-btn:hover{background:#e0f2f1}
  .loader{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:40;display:flex;align-items:center;justify-content:center}
  .loader.hidden{display:none}
  .loader-box{background:#fff;border-radius:12px;padding:22px 28px;display:flex;align-items:center;gap:14px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.2)}
  .spin{width:26px;height:26px;border:3px solid #cbd5e1;border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#166534;color:#fff;padding:10px 18px;border-radius:10px;z-index:30;font-weight:600;display:none}
  @media (max-width:760px){.hide-m{display:none}.tbl th,.tbl td{padding:6px 5px;font-size:12.5px}.bal .v{font-size:17px}.overlay{padding:0}.modal{border-radius:0;min-height:100%}.btn-new{width:100%}}
  @media (max-width:760px){.g3,.g2{grid-template-columns:1fr} main{padding:10px}}
</style>
</head>
<body>
<header>
  <h1>LONDON Ledger</h1>
  <div id="hdrRight" class="hidden">
    <span class="who" id="who"></span>
    <button class="ghost" onclick="refresh()">Refresh</button>
    <button class="ghost" onclick="doLogout()">Logout</button>
  </div>
</header>

<!-- LOGIN -->
<div id="login" class="card">
  <h2>Login</h2>
  <div class="grid">
    <div><label>Name</label><input id="lgName" autocomplete="username"></div>
    <div><label>PIN</label><input id="lgPin" type="password" inputmode="numeric" autocomplete="current-password"></div>
    <button id="lgBtn" onclick="doLogin()">Login</button>
  </div>
  <div id="lgMsg" class="msg"></div>
</div>

<!-- APP -->
<main id="app" class="hidden">

  <div class="card">
    <h2>Balance</h2>
    <div class="balances" id="balances"></div>
  </div>

  <div class="topbar"><button class="btn-new" onclick="openForm()">＋ New entry</button></div>

  <div class="card">
    <div class="tabs" id="curTabs"></div>
    <div id="groups"></div>
  </div>

  <div class="card">
    <h2>Pending</h2>
    <div class="scroll" id="pending"></div>
    <div id="pMsg" class="msg"></div>
  </div>
</main>

<!-- ENTRY FORM (popup) -->
<div class="overlay hidden" id="formBox">
  <div class="modal">
    <div class="modal-head"><h2 id="formTitle">New entry</h2><button class="x" onclick="closeForm()" aria-label="Close">✕</button></div>
    <div class="grid g3">
      <div><label>Date *</label><input type="date" id="fDate"></div>
      <div><label>Account Type *</label><select id="fAcc"></select></div>
      <div><label>Description *</label><input id="fDesc" maxlength="200"></div>
    </div>
    <div class="grid g2" style="margin-top:12px">
      <div class="side rec">
        <h3>RECEIVE</h3>
        <label>Receive currency</label>
        <div class="chips" id="rChips"></div><input type="hidden" id="rCur">
        <label>Receive amount</label>
        <input id="rAmt" type="text" inputmode="decimal" autocomplete="off">
        <label class="chk"><input type="checkbox" id="rDone" checked> Received (untick = Pending)</label>
      </div>
      <div class="side paid">
        <h3>PAID</h3>
        <label>Paid currency</label>
        <div class="chips" id="pChips"></div><input type="hidden" id="pCur">
        <label>Paid amount</label>
        <input id="pAmt" type="text" inputmode="decimal" autocomplete="off">
        <label class="chk"><input type="checkbox" id="pDone" checked> Paid (untick = Pending)</label>
        <div class="hint" id="pHint"></div>
      </div>
    </div>
    <div style="margin-top:12px"><label>Remark</label><textarea id="fRemark" maxlength="300"></textarea></div>
    <div style="margin-top:12px;display:flex;gap:8px">
      <button id="saveBtn" onclick="doSave()">Save entry</button>
      <button class="light" onclick="closeForm()">Cancel</button>
    </div>
    <div id="fMsg" class="msg"></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<div class="loader hidden" id="loader"><div class="loader-box"><div class="spin"></div><span id="loaderText">Please wait…</span></div></div>

<script>
  var S = { token: null, user: null, dash: null, tab: null, curs: [], editRow: null, editOrig: null };

  function ss(k, v){ try{ if(v===undefined) return sessionStorage.getItem(k); if(v===null) sessionStorage.removeItem(k); else sessionStorage.setItem(k,v); }catch(e){ return null; } }
  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function fmt(n){ return Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
  function cls(n){ return Number(n)<0 ? 'neg' : ''; }
  function localYmd(){ var d=new Date(); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
  function showDate(ymd){ if(!ymd) return ''; var m=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']; var p=ymd.split('-'); return p[2]+'-'+m[Number(p[1])-1]+'-'+p[0]; }
  function msg(id, text, ok){ var el=$(id); el.className='msg '+(text?(ok?'ok':'err'):''); el.textContent=text||''; }

  /* ====== ====== */
  var API_URL = 'https://script.google.com/macros/s/AKfycbwU-3F71PV1k3ngndjQloOLBlCtC-t0KryQMq4Bv-tfScqQu7KWx3fWxpFU4WgCQrFGuw/exec';

  function call(fn){
    var args=[].slice.call(arguments,1);
    return fetch(API_URL,{
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},   // text/plain = no CORS preflight
      body:JSON.stringify({action:fn,args:args}),
      redirect:'follow'
    }).then(function(r){
      if(!r.ok) throw new Error('Server error ('+r.status+'). Please try again.');
      return r.json();
    }).then(function(j){
      if(j.ms){ S.lastMs=j.ms; try{ console.log('['+fn+'] server ms', JSON.stringify(j.ms)); }catch(e){} }
      if(!j.ok){
        var m=String(j.error||'Unknown error');
        if(m.indexOf('SESSION_EXPIRED')>=0){ showLogin('Session expired. Please log in again.'); }
        throw new Error(m);
      }
      return j.data;
    }, function(err){
      if(err instanceof TypeError) throw new Error('Network error. Check internet connection and try again.');
      throw err;
    });
  }

  /* ---------- login ---------- */
  function loading(t){ if(t){ $('loaderText').textContent=t; $('loader').classList.remove('hidden'); } else $('loader').classList.add('hidden'); }
  function showLogin(text){
    loading('');
    S.token=null; ss('tok',null);
    $('app').classList.add('hidden'); $('hdrRight').classList.add('hidden'); $('login').classList.remove('hidden');
    msg('lgMsg', text||'');
  }
  function doLogin(){
    var b=$('lgBtn'); b.disabled=true; msg('lgMsg',''); loading('Logging in…');
    call('login',$('lgName').value,$('lgPin').value).then(function(r){
      S.token=r.token; ss('tok',r.token); $('lgPin').value=''; loading('Loading data…'); return start();
    }).catch(function(e){ msg('lgMsg',e.message); }).then(function(){ b.disabled=false; loading(''); });
  }
  function doLogout(){ call('logout',S.token).catch(function(){}); showLogin(''); }
  $('lgPin').addEventListener('keydown',function(e){ if(e.key==='Enter') doLogin(); });

  function start(){
    return call('getInit',S.token).then(function(d){
      S.user=d.user;
      $('who').textContent=d.user;
      fillSelect($('fAcc'), d.accountTypes, 'Select account type');
      S.curs=d.currencies||[];
      buildChips('r'); buildChips('p');
      $('login').classList.add('hidden'); $('app').classList.remove('hidden'); $('hdrRight').classList.remove('hidden');
      render(d.dash);
    });
  }
  function fillSelect(sel, items, placeholder){
    sel.innerHTML='<option value="">'+esc(placeholder)+'</option>'+items.map(function(x){return '<option>'+esc(x)+'</option>';}).join('');
  }

  /* ---------- render ---------- */
  function render(dash){
    S.dash=dash;
    // balance cards
    $('balances').innerHTML = dash.balances.length ? dash.balances.map(function(b){
      var p=[]; if(b.pendPaid) p.push('Pending paid: '+fmt(b.pendPaid)); if(b.pendRec) p.push('Pending receive: '+fmt(b.pendRec));
      return '<div class="bal"><div class="c">'+esc(b.cur)+'</div><div class="v '+cls(b.balance)+'">'+fmt(b.balance)+'</div><div class="p">'+esc(p.join(' · '))+'</div></div>';
    }).join('') : '<span class="muted">No entries yet.</span>';

    // today's groups
    var curList=dash.groups.map(function(g){return g.cur;});
    if(!S.tab || curList.indexOf(S.tab)<0){
      var firstWith=dash.groups.filter(function(g){return g.lines.length;})[0];
      S.tab = curList.indexOf('GBP')>=0 ? 'GBP' : (firstWith?firstWith.cur:curList[0]);
    }
    $('curTabs').innerHTML = dash.groups.map(function(g){
      return '<button class="tab'+(g.cur===S.tab?' active':'')+'" data-cur="'+esc(g.cur)+'" onclick="selectTab(this.getAttribute(\'data-cur\'))">'+
        esc(g.cur)+(g.lines.length?'<span class="cnt">'+g.lines.length+'</span>':'')+'</button>';
    }).join('');
    var g = dash.groups.filter(function(x){return x.cur===S.tab;})[0];
    if(!g){ $('groups').innerHTML='<span class="muted">No entries today.</span>'; }
    else {
      var rows='<tr class="open"><td class="hide-m"></td><td colspan="3">Opening balance</td><td class="n '+cls(g.opening)+'">'+fmt(g.opening)+'</td></tr>';
      rows+= g.lines.length ? g.lines.map(function(l){
        return '<tr><td class="hide-m">'+esc(l.acc)+'</td>'+
          '<td>'+esc(l.desc)+(l.yesterday?'<span class="badge b-y">Yesterday</span>':'')+(l.done?'':'<span class="badge b-pend b-pend-s">Pending</span>')+(S.dash.entries&&S.dash.entries[l.row]?'<button class="edit-btn" title="Edit" aria-label="Edit" onclick="editRow('+l.row+')">✎</button>':'')+'</td>'+
          '<td class="n">'+(l.type==='RECEIVED'?fmt(l.amt):'')+'</td>'+
          '<td class="n">'+(l.type==='PAID'?fmt(l.amt):'')+'</td>'+
          '<td class="n '+cls(l.running)+'">'+fmt(l.running)+'</td></tr>';
      }).join('') : '<tr><td colspan="5" class="muted">No '+esc(g.cur)+' entries today.</td></tr>';
      var pend=[]; if(g.pendRec) pend.push('Pending receive '+fmt(g.pendRec)); if(g.pendPaid) pend.push('Pending paid '+fmt(g.pendPaid));
      rows+='<tr class="close"><td class="hide-m"></td><td colspan="3">Closing'+(pend.length?' <span class="muted" style="font-weight:400">('+esc(pend.join(' · '))+')</span>':'')+'</td><td class="n '+cls(g.closing)+'">'+fmt(g.closing)+'</td></tr>';
      $('groups').innerHTML='<div class="scroll"><table class="tbl">'+
        '<thead><tr><th class="hide-m">Account</th><th>Description</th><th class="n">Received</th><th class="n">Paid</th><th class="n">Running Bal</th></tr></thead>'+
        '<tbody>'+rows+'</tbody></table></div>';
    }

    // pending list
    $('pending').innerHTML = dash.pending.length ? '<table class="tbl"><thead><tr><th>Date</th><th class="hide-m">Account</th><th>Description</th><th class="n">Amount</th></tr></thead><tbody>'+
      dash.pending.map(function(p,i){
        return '<tr><td>'+esc(showDate(p.date))+'</td><td class="hide-m">'+esc(p.acc)+'</td><td>'+esc(p.desc)+'</td><td class="n"><b>'+(p.type==='PAID'?'Paid ':'Rec ')+'</b>'+fmt(p.amt)+' '+esc(p.cur)+'</td>'+
          '</tr><tr class="act"><td colspan="4"><div class="row-actions"><input type="date" id="pd'+i+'" value="'+localYmd()+'"><button onclick="markDone('+i+')">Done</button></div></td></tr>';
      }).join('')+'</tbody></table>' : '<span class="muted">Nothing pending.</span>';

    updateHints();
  }

  /* ---------- live hints ---------- */
  function balOf(cur){
    var b=(S.dash&&S.dash.balances||[]).filter(function(x){return x.cur===cur;})[0];
    return b||{cur:cur,balance:0,pendPaid:0,pendRec:0};
  }
  // Only a red warning when a completed PAID amount is more than the available balance (never blocks save)
  function updateHints(){
    var pc=$('pCur').value, pa=amtVal('pAmt');
    var rc=$('rCur').value, ra=amtVal('rAmt');
    var h=$('pHint');
    if(pc && pa>0){
      var avail=balOf(pc).balance + (rc===pc ? ra : 0);
      if(S.editRow && S.dash.entries[S.editRow]){ var o=S.dash.entries[S.editRow]; // undo old values of the row being edited
        if(o.pCur===pc) avail+=o.pAmt; if(o.rCur===pc) avail-=o.rAmt; }
      if(pa>avail){
        h.innerHTML='<span class="warn">Only '+fmt(avail)+' '+esc(pc)+' available. The balance will go negative.</span>';
        h.classList.add('show'); return;
      }
    }
    h.classList.remove('show'); h.innerHTML='';
  }
  function selectTab(cur){ S.tab=cur; render(S.dash); }
  function amtVal(id){ var n=Number(String($(id).value).replace(/,/g,'').trim()); return isNaN(n)?0:n; }
  function buildChips(side){
    $(side+'Chips').innerHTML=S.curs.map(function(c){
      return '<button type="button" class="chip" data-cur="'+esc(c)+'" onclick="pickCur(\''+side+'\',this.getAttribute(\'data-cur\'))">'+esc(c)+'</button>';
    }).join('');
  }
  function setCur(side,cur){
    $(side+'Cur').value=cur||'';
    [].forEach.call($(side+'Chips').querySelectorAll('.chip'),function(b){ b.classList.toggle('sel', b.getAttribute('data-cur')===cur); });
    updateHints();
  }
  function pickCur(side,cur){ setCur(side, $(side+'Cur').value===cur ? '' : cur); } // tap again = unselect
  function toast(t,stay){ var el=$('toast'); clearTimeout(toast._t); if(!t){el.style.display='none';return;} el.textContent=t; el.style.display='block'; if(!stay) toast._t=setTimeout(function(){el.style.display='none';},2500); }
  function openForm(entry){
    resetForm();
    S.editRow=null; S.editOrig=null;
    if(entry){
      S.editRow=entry.row; S.editOrig={date:entry.date, desc:entry.desc};
      $('fDate').value=entry.date; $('fAcc').value=entry.acc; $('fDesc').value=entry.desc; $('fRemark').value=entry.remark||'';
      setCur('r',entry.rCur); $('rAmt').value=entry.rAmt||''; $('rDone').checked=entry.rCur?entry.rDone:true;
      setCur('p',entry.pCur); $('pAmt').value=entry.pAmt||''; $('pDone').checked=entry.pCur?entry.pDone:true;
    }
    $('formTitle').textContent = entry ? 'Edit entry' : 'New entry';
    $('saveBtn').textContent = entry ? 'Update entry' : 'Save entry';
    $('formBox').classList.remove('hidden'); document.body.style.overflow='hidden';
    updateHints();
  }
  function closeForm(){ $('formBox').classList.add('hidden'); document.body.style.overflow=''; S.editRow=null; S.editOrig=null; }
  function editRow(row){ var e=S.dash&&S.dash.entries&&S.dash.entries[row]; if(e) openForm(e); }
  document.addEventListener('keydown',function(e){ if(e.key==='Escape' && !$('formBox').classList.contains('hidden')) closeForm(); });
  ['pAmt','pDone','rAmt','rDone'].forEach(function(id){
    $(id).addEventListener('input',updateHints); $(id).addEventListener('change',updateHints);
  });

  /* ---------- actions ---------- */
  function resetForm(){
    $('fDate').value=localYmd(); $('fDesc').value=''; $('fRemark').value='';
    var acc=$('fAcc'); acc.value = [].some.call(acc.options,function(o){return o.value==='CLIENT';}) ? 'CLIENT' : '';
    ['pAmt','rAmt'].forEach(function(id){ $(id).value=''; }); setCur('r',''); setCur('p','');
    $('rDone').checked=true; $('pDone').checked=true;
    msg('fMsg',''); updateHints();
  }
  function clientCheck(){
    var e=[], pc=$('pCur').value, pa=$('pAmt').value.trim(), rc=$('rCur').value, ra=$('rAmt').value.trim();
    if(!$('fDate').value) e.push('DATE is required.');
    if(!$('fAcc').value) e.push('Select ACCOUNT TYPE.');
    if(!$('fDesc').value.trim()) e.push('DESCRIPTION is required.');
    var pAny=pc||pa, rAny=rc||ra;
    if(!pAny&&!rAny) e.push('Fill at least one side: RECEIVE or PAID.');
    if(rAny){ if(!rc) e.push('RECEIVE: select a currency.'); if(!(amtVal('rAmt')>0)) e.push('RECEIVE: amount must be more than 0.'); }
    if(pAny){ if(!pc) e.push('PAID: select a currency.'); if(!(amtVal('pAmt')>0)) e.push('PAID: amount must be more than 0.'); }
    return e;
  }
  function doSave(){
    var errs=clientCheck(); if(errs.length){ msg('fMsg',errs.join('\n')); return; }
    var b=$('saveBtn'); b.disabled=true; msg('fMsg','');
    var entry={ date:$('fDate').value, acc:$('fAcc').value, desc:$('fDesc').value, remark:$('fRemark').value,
      rCur:$('rCur').value, rAmt:($('rAmt').value.trim()?amtVal('rAmt'):''), rDone:$('rDone').checked,
      pCur:$('pCur').value, pAmt:($('pAmt').value.trim()?amtVal('pAmt'):''), pDone:$('pDone').checked };
    var editing=S.editRow, orig=S.editOrig;
    // Close the form at once; the sheet is updated in the background
    closeForm(); toast(editing?'Updating…':'Saving…',true);
    var t0=Date.now();
    var req = editing ? call('updateEntry',S.token,editing,orig,entry) : call('saveEntry',S.token,entry);
    req.then(function(d){ render(d);
      var tot=((Date.now()-t0)/1000).toFixed(1), srv=S.lastMs&&S.lastMs.total?(S.lastMs.total/1000).toFixed(1):'?';
      S.timing='Total '+tot+'s | Google script '+srv+'s | '+JSON.stringify(S.lastMs||{});
      toast(editing?'Entry updated ✓':'Entry saved ✓'); })
      .catch(function(e){
        // Re-open the same form with the typed values so nothing is lost
        S.editRow=editing; S.editOrig=orig;
        $('formTitle').textContent = editing ? 'Edit entry' : 'New entry';
        $('saveBtn').textContent = editing ? 'Update entry' : 'Save entry';
        $('formBox').classList.remove('hidden'); document.body.style.overflow='hidden';
        msg('fMsg',e.message); toast('');
      }).then(function(){ b.disabled=false; });
  }
  function markDone(i){
    var p=S.dash.pending[i], d=$('pd'+i).value;
    if(!d){ msg('pMsg','Select a date.'); return; }
    var sideTxt = p.type==='PAID' ? 'Paid' : 'Received';
    if(!confirm('Confirm: mark as DONE?\n\n'+p.desc+'\n'+sideTxt+' '+fmt(p.amt)+' '+p.cur+'\nDate: '+showDate(d))) return;
    msg('pMsg',''); toast('Updating…',true);
    call('markDone',S.token,p.row,p.type,d).then(function(dash){ render(dash); toast('Marked done ✓'); })
      .catch(function(e){ toast(''); msg('pMsg',e.message); });
  }
  function refresh(){ loading('Refreshing…'); call('getDashboard',S.token).then(render).catch(function(){}).then(function(){ loading(''); }); }

  /* ---------- boot ---------- */
  (function(){
    var t=ss('tok');
    if(t){ S.token=t; loading('Loading data…'); start().catch(function(){ showLogin(''); }).then(function(){ loading(''); }); }
  })();
</script>
</body>
</html>
